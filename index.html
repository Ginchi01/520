<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>致雪宝宝 - 520 专属宇宙</title>
    <style>
        /* 
         * =========================================
         * 核心样式与变量定义
         * =========================================
         */
        :root {
            --bg-color: #050505;
            --heart-color-1: #ff7eb3;
            --heart-color-2: #ff758c;
            --text-primary: #ffffff;
            --text-secondary: #aabbcc;
            --glass-bg: rgba(20, 20, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-main: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* 禁止滚动，沉浸式体验 */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 背景星空 Canvas */
        #star-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 主画布：粒子爱心 */
        #heart-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
        }

        /* UI 层：包含文字和计时器 */
        #ui-layer {
            position: absolute;
            z-index: 3;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* 让点击事件穿透到 Canvas */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 环绕的关心话语容器 */
        .floating-word {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            animation: floatUp 10s infinite linear;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-20vh) rotate(20deg);
                opacity: 0;
            }
        }

        /* 核心文字区域 */
        .core-message-container {
            position: relative;
            pointer-events: auto;
            margin-bottom: 20px;
        }

        /* 轮转情话 */
        #rotating-text {
            font-size: 1.2rem;
            color: var(--heart-color-1);
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--heart-color-1);
            min-height: 1.5em;
        }

        /* 固定主标题 */
        #main-title {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(to right, #fff, #ff9a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 15px rgba(255, 154, 158, 0.6));
        }

        #sub-title {
            font-size: 1.2rem;
            letter-spacing: 5px;
            opacity: 0.9;
            margin-bottom: 30px;
            background: linear-gradient(to right, #ffffff, #ffd6e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 纪念日计时器 */
        .timer-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            gap: 20px;
            transform: translateY(20px);
            animation: slideUp 1s ease-out forwards;
            margin-top: 250px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-val {
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: linear-gradient(to bottom, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .time-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
            text-transform: uppercase;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 点击烟花文字样式 */
        .firework-text {
            position: absolute;
            font-weight: 900;
            /* 字体加粗 */
            font-size: 18px;
            /* 稍微放大一点 */
            pointer-events: none;
            z-index: 10;
            /* 添加文字描边和阴影，防止看不清 */
            text-shadow:
                0 0 10px currentColor,
                0 0 20px currentColor,
                0 0 30px currentColor;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
            /* 文字描边 */
            animation: explodeFade 1.5s ease-out forwards;
        }

        @keyframes explodeFade {
            0% {
                transform: scale(0.3) translate(0, 0) rotate(0deg);
                /* 起始小一点 */
                opacity: 1;
            }

            50% {
                opacity: 1;
                /* 在中间阶段应用刚才计算的最终状态 */
            }

            100% {
                transform: scale(var(--scale)) translate(var(--tx), var(--ty)) rotate(var(--rotate));
                opacity: 0;
            }
        }

        /* 底部提示 */
        .hint {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            animation: breathe 2s infinite ease-in-out;
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>

    <!-- 背景星空 -->
    <canvas id="star-canvas"></canvas>

    <!-- 粒子爱心 -->
    <canvas id="heart-canvas"></canvas>

    <!-- UI 层 -->
    <div id="ui-layer">

        <!-- 环绕的关心话语将由 JS 生成在这里 -->
        <div id="words-container"></div>

        <div class="core-message-container">
            <div id="rotating-text"></div>
            <div id="main-title">雪宝宝 520 快乐</div>
            <div id="main-title">我爱你哦</div>
            <div id="sub-title">我会一直陪着你哒</div>
        </div>

        <div class="timer-card">
            <div class="time-unit">
                <span class="time-val" id="days">00</span>
                <span class="time-label">天</span>
            </div>
            <div style="color:rgba(255,255,255,0.2); font-size:1.5rem; align-self:center;">:</div>
            <div class="time-unit">
                <span class="time-val" id="hours">00</span>
                <span class="time-label">时</span>
            </div>
            <div style="color:rgba(255,255,255,0.2); font-size:1.5rem; align-self:center;">:</div>
            <div class="time-unit">
                <span class="time-val" id="minutes">00</span>
                <span class="time-label">分</span>
            </div>
            <div style="color:rgba(255,255,255,0.2); font-size:1.5rem; align-self:center;">:</div>
            <div class="time-unit">
                <span class="time-val" id="seconds">00</span>
                <span class="time-label">秒</span>
            </div>
        </div>

        <div class="hint">轻触屏幕，查收惊喜</div>
    </div>

    <script>
        /**
         * ========================================================
         * 模块 1: 工具函数库 (Utils)
         * 包含随机数、颜色转换、距离计算等基础数学方法
         * ========================================================
         */
        const Utils = {
            // 生成 min 到 max 之间的随机整数
            randomInt: function (min, max) {
                return Math.floor(Math.random() * (max - min + 1) + min);
            },

            // 生成 min 到 max 之间的随机浮点数
            randomFloat: function (min, max) {
                return Math.random() * (max - min) + min;
            },

            // 计算两点间距离
            getDistance: function (x1, y1, x2, y2) {
                const xDist = x2 - x1;
                const yDist = y2 - y1;
                return Math.sqrt(Math.pow(xDist, 2) + Math.pow(yDist, 2));
            },

            // 极坐标转笛卡尔坐标
            polarToCartesian: function (centerX, centerY, radius, angleInDegrees) {
                const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
                return {
                    x: centerX + (radius * Math.cos(angleInRadians)),
                    y: centerY + (radius * Math.sin(angleInRadians))
                };
            },

            // HSL 转 RGB 用于彩虹色生成
            hslToHex: function (h, s, l) {
                l /= 100;
                const a = s * Math.min(l, 1 - l) / 100;
                const f = n => {
                    const k = (n + h / 30) % 12;
                    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color).toString(16).padStart(2, '0');
                };
                return `#${f(0)}${f(8)}${f(4)}`;
            }
        };

        /**
         * ========================================================
         * 模块 2: 配置数据 (Config)
         * 所有的文本内容、日期设置都在这里
         * ========================================================
         */
        const Config = {
            // 纪念日设置：2026年3月3日
            anniversaryDate: new Date("2026-03-03T00:00:00"),

            // 轮播情话库
            rotatingQuotes: [
                "遇见你，是我这辈子最幸运的事",
                "想把全世界的温柔都给你",
                "你是我的今天和所有的明天",
                "这世界很暗，但你来了",
                "我想和你一起浪费时间",
                "除了喜欢你，我什么都做不好",
                "你的眼里有星辰大海",
                "只要有你，哪里都是风景",
                "心跳多久，爱你多久",
                "你是我所有的少女情怀和心之所向"
            ],

            // 环绕关心的话 (嘘寒问暖)
            caringWords: [
                "记得按时吃饭哦",
                "天冷记得多穿衣",
                "别熬夜太晚啦",
                "多喝水对身体好",
                "今天也要开心呀",
                "累了就休息一下",
                "想你了，每一秒",
                "不管发生什么我都在",
                "记得吃早饭",
                "少喝奶茶多睡觉",
                "注意身体，别太累",
                "你是最棒的宝宝",
                "无论何时，爱你如初",
                "记得涂防晒",
                "工作不要太拼命",
                "照顾好自己"
            ],

            // 点击烟花弹出的话
            fireworkTexts: [
                "爱你哦",
                "想你",
                "么么哒",
                "乖",
                "抱抱",
                "亲亲",
                "宝贝",
                "最喜欢你",
                "永远在一起",
                "你是唯一",
                "好喜欢你",
                "比心",
                "520快乐"
            ],

            colors: {
                rainbowStart: 0,
                rainbowSpeed: 2
            }
        };

        /**
         * ========================================================
         * 模块 3: 星空背景模块 (Starfield)
         * 创建深邃的背景星星
         * ========================================================
         */
        class Starfield {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.stars = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.initStars();
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initStars() {
                this.stars = [];
                const starCount = Math.floor((this.canvas.width * this.canvas.height) / 4000); // 密度控制
                for (let i = 0; i < starCount; i++) {
                    this.stars.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        radius: Math.random() * 1.5,
                        alpha: Math.random(),
                        twinkleSpeed: Math.random() * 0.02 + 0.005
                    });
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.fillStyle = '#050505';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.stars.forEach(star => {
                    // 闪烁效果
                    star.alpha += star.twinkleSpeed;
                    if (star.alpha > 1 || star.alpha < 0.2) {
                        star.twinkleSpeed = -star.twinkleSpeed;
                    }

                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                    this.ctx.fill();
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        /**
         * ========================================================
         * 模块 4: 3D 粒子爱心模块 (HeartParticleSystem)
         * 核心视觉，使用 3D 数学投影到 2D Canvas
         * ========================================================
         */
        class HeartParticleSystem {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.centerX = this.width / 2;
                this.centerY = this.height / 2;
                this.scale = Math.min(this.width, this.height) / 4; // 爱心大小适配屏幕

                // 3D 旋转角度
                this.angleX = 0;
                this.angleY = 0;
                this.targetAngleX = 0;
                this.targetAngleY = 0;

                this.resize();
                window.addEventListener('resize', () => this.resize());

                // 鼠标/触摸交互
                this.initInteraction();
                this.initParticles();
                this.animate();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.centerX = this.width / 2;
                this.centerY = this.height / 2;
                this.scale = Math.min(this.width, this.height) / 4;
            }

            initInteraction() {
                let isDragging = false;
                let startX, startY;

                const startDrag = (e) => {
                    isDragging = true;
                    startX = e.clientX || e.touches[0].clientX;
                    startY = e.clientY || e.touches[0].clientY;
                };

                const drag = (e) => {
                    if (!isDragging) return;
                    const x = e.clientX || e.touches[0].clientX;
                    const y = e.clientY || e.touches[0].clientY;

                    const deltaX = x - startX;
                    const deltaY = y - startY;

                    this.targetAngleY = deltaX * 0.01;
                    this.targetAngleX = deltaY * 0.01;

                    startX = x;
                    startY = y;
                };

                const endDrag = () => {
                    isDragging = false;
                };

                this.canvas.addEventListener('mousedown', startDrag);
                window.addEventListener('mousemove', drag);
                window.addEventListener('mouseup', endDrag);

                this.canvas.addEventListener('touchstart', startDrag);
                window.addEventListener('touchmove', drag);
                window.addEventListener('touchend', endDrag);
            }

            initParticles() {
                this.particles = [];
                const particleCount = 1200; // 粒子数量

                for (let i = 0; i < particleCount; i++) {
                    // 爱心数学公式生成点
                    // x = 16sin^3(t)
                    // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
                    // z = 随机深度

                    let t = Math.random() * Math.PI * 2;
                    let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 18; // 归一化
                    let x = (16 * Math.pow(Math.sin(t), 3)) / 18;

                    // 添加厚度和随机性
                    let z = Utils.randomFloat(-0.5, 0.5);

                    // 随机扰动，让爱心看起来更像粒子云而不是实线
                    let dist = Math.sqrt(x * x + y * y);
                    let noise = Utils.randomFloat(0, 0.15);
                    x = x + (x / dist) * noise;
                    y = y + (y / dist) * noise;

                    this.particles.push({
                        x: x * this.scale,
                        y: y * this.scale,
                        z: z * this.scale,
                        baseX: x * this.scale,
                        baseY: y * this.scale,
                        baseZ: z * this.scale,
                        size: Utils.randomFloat(1.5, 3.5),
                        colorOffset: Utils.randomInt(0, 360)
                    });
                }
            }

            rotatePoint(x, y, z, angleX, angleY) {
                // 绕Y轴旋转
                let cosY = Math.cos(angleY);
                let sinY = Math.sin(angleY);
                let x1 = x * cosY - z * sinY;
                let z1 = z * cosY + x * sinY;

                // 绕X轴旋转
                let cosX = Math.cos(angleX);
                let sinX = Math.sin(angleX);
                let y1 = y * cosX - z1 * sinX;
                let z2 = z1 * cosX + y * sinX;

                return { x: x1, y: y1, z: z2 };
            }

            animate() {
                this.ctx.clearRect(0, 0, this.width, this.height);

                // 自动缓慢旋转
                if (Math.abs(this.targetAngleY) > 0.01) {
                    this.angleY += (this.targetAngleY - this.angleY) * 0.05;
                } else {
                    this.angleY += 0.005; // 默认自转
                    this.targetAngleY = 0;
                }

                this.angleX += (this.targetAngleX - this.angleX) * 0.05;

                // 绘制粒子
                this.particles.forEach(p => {
                    const rotated = this.rotatePoint(p.baseX, p.baseY, p.baseZ, this.angleX, this.angleY);

                    // 简单的透视投影
                    const fov = 400;
                    const scale = fov / (fov + rotated.z);

                    const x2d = this.centerX + rotated.x * scale;
                    const y2d = this.centerY + rotated.y * scale;
                    const size = p.size * scale;
                    const alpha = (rotated.z + 100) / 200; // 深度越深越暗

                    // 彩虹色计算
                    const hue = (Config.colors.rainbowStart + p.colorOffset + this.angleY * 50) % 360;
                    const color = Utils.hslToHex(hue, 80, 60);

                    this.ctx.beginPath();
                    this.ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                    this.ctx.fillStyle = color;
                    this.ctx.globalAlpha = Math.max(0.2, alpha);
                    this.ctx.fill();
                });
                this.ctx.globalAlpha = 1;

                Config.colors.rainbowStart += Config.colors.rainbowSpeed;

                requestAnimationFrame(() => this.animate());
            }
        }

        /**
         * ========================================================
         * 模块 5: 环绕文字管理器 (WordManager)
         * 负责生成不重叠的关心话语
         * ========================================================
         */
        class WordManager {
            constructor() {
                this.container = document.getElementById('words-container');
                this.activeWords = [];
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.safeZoneRadius = Math.min(this.width, this.height) / 3.5; // 避开中间爱心区域

                window.addEventListener('resize', () => {
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.safeZoneRadius = Math.min(this.width, this.height) / 3.5;
                });

                this.init();
            }

            init() {
                // 生成 15-20 个漂浮的关心话语
                const count = 18;
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        this.createWord();
                    }, i * 300);
                }

                // 循环补充
                setInterval(() => {
                    if (this.activeWords.length < count) {
                        this.createWord();
                    }
                }, 2000);
            }

            createWord() {
                const word = document.createElement('div');
                word.className = 'floating-word';

                // 随机文本
                const text = Config.caringWords[Utils.randomInt(0, Config.caringWords.length - 1)];
                word.innerText = text;

                // 随机颜色 (柔和色系)
                const colors = ['#ff9a9e', '#fecfef', '#fecfef', '#a18cd1', '#fbc2eb', '#8fd3f4', '#84fab0'];
                word.style.color = colors[Utils.randomInt(0, colors.length - 1)];

                // --- 核心算法：防重叠定位 ---
                let x, y, distFromCenter, attempts = 0;
                const margin = 60; // 文字间距

                do {
                    // 在屏幕随机位置生成，但避开中心 safeZoneRadius 区域
                    // 使用极坐标更容易控制避开中心
                    const angle = Utils.randomFloat(0, Math.PI * 2);
                    const radius = Utils.randomFloat(this.safeZoneRadius + 50, Math.min(this.width, this.height) / 1.8);

                    x = this.width / 2 + Math.cos(angle) * radius;
                    y = this.height / 2 + Math.sin(angle) * radius;

                    attempts++;
                } while (this.isOverlapping(x, y, margin) && attempts < 50);

                word.style.left = `${x}px`;
                word.style.top = `${y}px`;

                // 随机动画时长
                word.style.animationDuration = `${Utils.randomFloat(10, 20)}s`;

                this.container.appendChild(word);

                // 记录位置用于后续检测
                this.activeWords.push({
                    el: word,
                    x: x,
                    y: y,
                    w: word.offsetWidth,
                    h: word.offsetHeight
                });

                // 移除后的清理
                word.addEventListener('animationend', () => {
                    word.remove();
                    this.activeWords = this.activeWords.filter(w => w.el !== word);
                });
            }

            isOverlapping(newX, newY, margin) {
                // 检查新坐标是否与现有文字重叠
                for (let word of this.activeWords) {
                    // 简单圆形碰撞检测
                    const dist = Utils.getDistance(newX, newY, word.x, word.y);
                    // 估算半径 (宽/2 + margin)
                    const r1 = 40; // 新文字估算半径
                    const r2 = 40; // 现有文字估算半径

                    if (dist < (r1 + r2 + margin / 2)) {
                        return true;
                    }
                }
                return false;
            }
        }

        /**
         * ========================================================
         * 模块 6: 烟花文字特效 (FireworkText)
         * 点击屏幕炸开彩虹文字
         * ========================================================
         */
        class FireworkText {
            constructor() {
                this.container = document.getElementById('ui-layer');
                this.initListener();
            }

            initListener() {
                // 监听点击
                document.addEventListener('click', (e) => {
                    // 避免点击到按钮等交互元素触发（虽然这里主要是Canvas）
                    this.createExplosion(e.clientX, e.clientY);
                });

                // 监听触摸
                document.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.createExplosion(touch.clientX, touch.clientY);
                });
            }

            createExplosion(x, y) {
                const count = 15; // 增加数量，更有烟花感
                // 减小重力影响，让它们飞得更远
                const gravity = 0.95;

                for (let i = 0; i < count; i++) {
                    const span = document.createElement('span');
                    span.className = 'firework-text';

                    // 1. 随机文本
                    const text = Config.fireworkTexts[Utils.randomInt(0, Config.fireworkTexts.length - 1)];
                    span.innerText = text;

                    // 2. 强化彩虹色 (饱和度和亮度更高)
                    // 使用 HSL 直接设置，比 HEX 颜色过渡更自然
                    const hue = (Date.now() / 10 + i * 30) % 360;
                    span.style.color = `hsl(${hue}, 100%, 65%)`;

                    // 3. 设置初始位置
                    span.style.left = `${x}px`;
                    span.style.top = `${y}px`;

                    // --- 核心优化：更自然的飞散轨迹 ---
                    // 随机角度 (0 ~ 360度)
                    const angle = Utils.randomFloat(0, Math.PI * 2);
                    // 随机速度 (差异化速度，有的快有的慢)
                    const speed = Utils.randomFloat(80, 180);

                    // 将极坐标转换为直角坐标 (X, Y 方向的速度分量)
                    // 乘以 gravity 是为了让它们在飞散时有一个轻微的加速/减速弧度
                    const tx = Math.cos(angle) * speed * gravity;
                    const ty = Math.sin(angle) * speed * gravity;

                    // --- 核心优化：添加旋转 ---
                    // 随机旋转角度，让文字炸开时是歪歪扭扭的，更自然
                    const rotate = Utils.randomFloat(-360, 360);

                    // --- 核心优化：添加缩放 ---
                    // 有的字大有的字小
                    const scale = Utils.randomFloat(1, 1.5);

                    // 4. 设置 CSS 变量
                    span.style.setProperty('--tx', `${tx}px`);
                    span.style.setProperty('--ty', `${ty}px`);
                    span.style.setProperty('--rotate', `${rotate}deg`); // 传入旋转值
                    span.style.setProperty('--scale', `${scale}`);     // 传入缩放值

                    // 5. 随机延迟，增加层次感
                    span.style.animationDelay = `${Utils.randomFloat(0, 0.3)}s`;

                    this.container.appendChild(span);

                    // 清理 DOM
                    setTimeout(() => { span.remove(); }, 2000);
                }
            }
        }

        /**
         * ========================================================
         * 模块 7: 时间计时器 (Timer)
         * 计算恋爱天数
         * ========================================================
         */
        class Timer {
            constructor() {
                this.startDate = Config.anniversaryDate;
                this.daysEl = document.getElementById('days');
                this.hoursEl = document.getElementById('hours');
                this.minsEl = document.getElementById('minutes');
                this.secsEl = document.getElementById('seconds');

                this.update();
                setInterval(() => this.update(), 1000);
            }

            update() {
                const now = new Date();
                const diff = now - this.startDate; // 毫秒差

                if (diff < 0) {
                    // 如果当前时间还没到2026年3月3日，显示倒计时
                    // 这里为了演示逻辑，如果还没到那一天，显示倒计时，到了之后显示正计时
                    // 但用户需求是“纪念日历”，通常指在一起之后。
                    // 假设当前时间已经过了2026年3月3日。
                    // 如果没到，我们显示距离在一起还有多久。

                    // 这里逻辑简化：直接计算绝对值，或者根据业务需求调整
                    // 假设当前是 2026年5月20日（如系统时间），则 diff > 0
                }

                const seconds = Math.floor((diff / 1000) % 60);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));

                this.daysEl.innerText = days.toString().padStart(2, '0');
                this.hoursEl.innerText = hours.toString().padStart(2, '0');
                this.minsEl.innerText = minutes.toString().padStart(2, '0');
                this.secsEl.innerText = seconds.toString().padStart(2, '0');
            }
        }

        /**
         * ========================================================
         * 模块 8: 轮播文字 (RotatingText)
         * 中间轮转的情话
         * ========================================================
         */
        class RotatingText {
            constructor() {
                this.el = document.getElementById('rotating-text');
                this.index = 0;
                this.quotes = Config.rotatingQuotes;

                this.update();
                setInterval(() => this.update(), 4000);
            }

            update() {
                // 淡出
                this.el.style.opacity = 0;

                setTimeout(() => {
                    this.el.innerText = this.quotes[this.index];
                    // 淡入
                    this.el.style.opacity = 1;

                    this.index = (this.index + 1) % this.quotes.length;
                }, 500);
            }
        }

        /**
         * ========================================================
         * 初始化所有模块
         * ========================================================
         */
        window.onload = function () {
            console.log("初始化浪漫程序...");
            new Starfield('star-canvas');
            new HeartParticleSystem('heart-canvas');
            new WordManager();
            new FireworkText();
            new Timer();
            new RotatingText();
            console.log("程序启动成功。祝雪宝宝520快乐！");
        };

    </script>
